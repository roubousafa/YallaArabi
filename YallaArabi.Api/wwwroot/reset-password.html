<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>يلا عربي - تغيير كلمة السر</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#d9dde3; --accent:#0f766e; --error:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e8ebf0; --muted:#9aa3b2; --line:#2c3340; --accent:#2dd4bf; --error:#f97066; --ok:#47cd89; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:1.3rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 20px; line-height:1.6; font-size:.95rem; }
  label { display:block; font-size:.9rem; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:12px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  ul { margin:10px 0 0; padding-inline-start:18px; color:var(--muted); font-size:.85rem; line-height:1.7; }
  .msg { margin-top:16px; font-size:.95rem; line-height:1.6; }
  .msg.error { color:var(--error); }
  .msg.ok { color:var(--ok); }
  .en { direction:ltr; text-align:left; display:block; font-size:.85rem; color:var(--muted); margin-top:2px; }
</style>
</head>
<body>
<main>
  <h1>تغيير كلمة السر<span class="en">Reset your password</span></h1>
  <p id="intro">اكتب كلمة سر جديدة لحسابك.</p>

  <form id="form" novalidate>
    <label for="password">كلمة السر الجديدة</label>
    <input id="password" type="password" autocomplete="new-password" required>
    <label for="confirm">أعد كتابة كلمة السر</label>
    <input id="confirm" type="password" autocomplete="new-password" required>
    <ul>
      <li>8 أحرف على الأقل</li>
      <li>حرف إنكليزي كبير واحد على الأقل (A-Z)</li>
      <li>رقم واحد على الأقل</li>
    </ul>
    <button id="submit" type="submit">حفظ كلمة السر</button>
  </form>

  <div id="message" class="msg" role="status" aria-live="polite"></div>
</main>

<script>
(function () {
  // The link puts the values after "#", so they never reach the server or its logs.
  var params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var token = params.get("token");
  var email = params.get("email");

  var form = document.getElementById("form");
  var message = document.getElementById("message");
  var button = document.getElementById("submit");

  function show(text, kind) {
    message.textContent = text;
    message.className = "msg " + kind;
  }

  if (!token || !email) {
    form.hidden = true;
    document.getElementById("intro").hidden = true;
    show("الرابط ناقص. افتح الرابط من الإيميل مرة تانية، أو اطلب رابط جديد من التطبيق.", "error");
    return;
  }

  history.replaceState(null, "", location.pathname);

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;

    if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
      show("كلمة السر لازم تكون 8 أحرف على الأقل، وفيها حرف إنكليزي كبير ورقم.", "error");
      return;
    }

    if (password !== confirm) {
      show("كلمتين السر مو متطابقتين.", "error");
      return;
    }

    button.disabled = true;
    show("", "");

    try {
      var response = await fetch("/api/v1/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, token: token, newPassword: password })
      });

      if (response.ok) {
        form.hidden = true;
        document.getElementById("intro").hidden = true;
        show("تم تغيير كلمة السر. ارجع للتطبيق وسجّل دخولك بكلمة السر الجديدة.", "ok");
        return;
      }

      if (response.status === 429) {
        show("محاولات كتير. استنّى دقيقة وجرّب مرة تانية.", "error");
      } else {
        show("الرابط منتهي أو مستخدم من قبل. اطلب رابط جديد من التطبيق.", "error");
      }
    } catch (e) {
      show("ما قدرنا نوصل للسيرفر. تأكد من الإنترنت وجرّب مرة تانية.", "error");
    }

    button.disabled = false;
  });
})();
</script>
</body>
</html>
